name: Publisher heartbeat monitor

# External check on the publisher machine. The Mac cannot tell you it lost power or network,
# because its dashboard lives on the same box. This runs on GitHub, reads the heartbeat pushed
# to the `health` branch every five minutes, and fails when it goes stale — a failed scheduled
# workflow is the alert.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the checker
        uses: actions/checkout@v4
        with:
          path: src

      - name: Check out the heartbeat
        uses: actions/checkout@v4
        with:
          ref: health
          path: health
          fetch-depth: 1
        continue-on-error: true

      - name: Verify freshness
        run: python3 src/scripts/check_heartbeat.py health/_health/publisher.json
