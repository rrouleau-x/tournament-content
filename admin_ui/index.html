<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Admin</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <h1>Tournament Admin</h1>
  <span class="sub clickable" id="btn-logout" title="Clear saved tokens">logout</span>
</header>

<div class="wrap" id="view-list">
  <div class="card">
    <div class="row row-gap-md">
      <h2 class="grow h2-flat">Tournaments</h2>
      <button class="btn-blue" id="btn-new">+ New Tournament</button>
    </div>
    <table>
      <thead><tr><th>Tournament</th><th>Status</th><th>Revision</th><th>Digest</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="wrap hidden" id="view-new">
  <div class="card card-narrow">
    <h2>New Tournament</h2>
    <div class="grid grid-gap-sm">
      <input id="n-org" placeholder="org (e.g. savannah-united)" class="input-std">
      <input id="n-slug" placeholder="slug (e.g. disney-showcase-2027)" class="input-std">
      <input id="n-name" placeholder="display name (optional)" class="input-std">
    </div>
    <div class="actions">
      <button class="btn-blue" id="btn-create">Create</button>
      <button class="btn-ghost" id="btn-cancel-new">Cancel</button>
    </div>
  </div>
</div>

<div class="wrap hidden" id="view-edit">
  <div class="row row-gap-md">
    <button class="btn-ghost" id="btn-back">← All tournaments</button>
    <h2 class="grow h2-flat" id="e-title"></h2>
    <span id="e-status" class="badge"></span>
  </div>
  <div id="e-statusbar" class="statusbar"></div>
  <div class="tabs" id="e-tabs"></div>
  <div class="card">
    <div class="row row-gap-sm">
      <span class="muted grow" id="e-module-desc"></span>
      <span class="saved hidden" id="e-saved">✓ saved</span>
    </div>
    <textarea id="e-editor" spellcheck="false"></textarea>
    <div class="actions">
      <button class="btn-blue" id="btn-save">Save Module</button>
      <button class="btn-ghost" id="btn-validate">Validate</button>
      <button class="btn-amber" id="btn-preview">Preview Publish</button>
      <button class="btn-green" id="btn-approve">Approve Content</button>
      <button class="btn-red" id="btn-publish">Publish</button>
      <button class="btn-ghost" id="btn-history" title="Show revision history for this module">History</button>
      <button class="btn-ghost" id="btn-autofill" title="AI-assisted fill for this module">Autofill</button>
    </div>
  </div>
  <div class="card hidden card-gap-top" id="e-report-card">
    <h2>Guide Health Report</h2>
    <pre class="report" id="e-report"></pre>
  </div>
  <div class="card hidden card-gap-top" id="e-history-card">
    <div class="row">
      <h2 class="grow h2-flat">Revision History</h2>
      <button class="btn-ghost" id="btn-history-close">Close</button>
    </div>
    <div id="e-history-list"></div>
    <pre class="report" id="e-diff"></pre>
  </div>
</div>

<div class="flash" id="flash"></div>

<script src="/static/app.js"></script>
</body>
</html>
